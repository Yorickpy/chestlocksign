name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: .\gradlew.bat build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chest-signlock
          path: build/libs/*.jar
